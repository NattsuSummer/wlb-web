name: Deploy

# main → https://balance-our-day.pages.dev
# pull requests → a preview URL (posted in the job summary) so changes can be tried before merging
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set yet — skipping deploy."; echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - if: steps.check.outputs.ready == 'true'
        run: npm install --no-audit --no-fund
      - if: steps.check.outputs.ready == 'true'
        run: npm run build
      - name: Create Pages project (first run only)
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler pages project create balance-our-day --production-branch main || echo "project exists"
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          npx wrangler pages deploy dist --project-name balance-our-day --branch "$BRANCH" --commit-dirty=true | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "### Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
